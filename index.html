<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корона и Сталь</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="brand"><img id="brand-icon" class="ic" alt=""><span data-i18n="title"></span></div>
      <div id="resbar"></div>
      <div id="top-actions">
        <button class="btn small" data-action="lang" id="lang-btn">EN</button>
        <button class="btn small" data-action="settings" data-i18n="settings"></button>
      </div>
    </header>
    <main id="main">
      <section id="world">
        <div id="stage">
          <div id="map">
            <canvas id="mapbg" width="320" height="200"></canvas>
            <div id="slots"></div>
          </div>
          <div id="battle" class="hidden">
            <div id="battle-head"></div>
            <canvas id="battlecv" width="960" height="390"></canvas>
            <div id="battle-foot"></div>
          </div>
          <div id="fx"></div>
        </div>
        <div id="goal"></div>
        <div id="log"></div>
      </section>
      <aside id="side">
        <nav id="tabs"></nav>
        <div id="panel"></div>
      </aside>
    </main>
  </div>
  <div id="modal" class="hidden"><div id="modal-box"></div></div>

  <script src="js/util.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/forge.js"></script>
  <script src="js/tavern.js"></script>
  <script src="js/gate.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
